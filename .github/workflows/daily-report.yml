name: Generate daily GitHub report

on:
  schedule:
    # 08:17 Beijing time (UTC+8), intentionally off the hour.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-daily-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate report from live public GitHub data
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/collect.mjs
      - name: Commit report and history
        run: |
          if git diff --quiet -- docs data; then
            echo "No report changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git commit -m "chore(report): update daily GitHub report"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
